<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WAKE 無料版｜今日の本命だけ無料公開</title>
<meta name="description" content="競艇AI予想WAKEの無料公開版。今日のレースの総合1位の艇と荒れ度、見送りAI判定だけを毎日無料で確認できます。" />
<style>
  :root {
    --bg: #0e1b2c;
    --panel: #13243a;
    --panel-2: #0e1b2c;
    --border: #284766;
    --text: #e8eef5;
    --text-dim: #9db5cc;
    --text-faint: #5f7f9f;
    --accent: #4ea1ff;
    --accent-2: #ffd166;
    --good: #5dd39e;
    --warn: #f9c513;
    --bad: #e08a8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  body { min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 60px; }

  header.top { text-align: center; margin-bottom: 22px; }
  .eyebrow {
    display: inline-block; font-size: 11px; letter-spacing: .18em;
    color: var(--text-dim); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 14px; margin-bottom: 10px;
  }
  h1 { font-size: 26px; font-weight: 900; margin: 0 0 8px; line-height: 1.4; }
  h1 .hl { color: var(--accent-2); }
  .sub { color: var(--text-dim); font-size: 13px; line-height: 1.8; margin: 0; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px; margin-top: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  .card h2 { font-size: 13px; letter-spacing: .1em; color: var(--text-dim); margin: 0 0 14px; font-weight: 800; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .field { flex: 1 1 140px; display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 11px; color: var(--text-dim); font-weight: 700; }
  select {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; width: 100%;
    font-family: inherit;
  }
  .date-fixed {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; width: 100%;
    box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button.primary {
    width: 100%; border: none; border-radius: 12px; padding: 14px 16px;
    font-size: 15px; font-weight: 900; cursor: pointer; margin-top: 14px;
    background: var(--accent); color: #061425;
  }
  button.primary:disabled { opacity: .55; cursor: wait; }

  .status { font-size: 12px; color: var(--text-dim); margin-top: 10px; line-height: 1.7; min-height: 1.2em; }
  .status.error { color: var(--bad); }

  .boats { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .boat {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
    background: var(--panel-2);
  }
  .boat.top { border-color: var(--accent-2); background: rgba(255,209,102,.08); }
  .boat .no {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px; background: #1b3048; color: var(--text-dim);
  }
  .boat.top .no { background: var(--accent-2); color: #1a2433; }
  .boat .name { flex: 1; font-size: 14px; font-weight: 700; }
  .boat .name .grade { color: var(--text-faint); font-size: 11px; font-weight: 700; margin-left: 6px; }
  .boat .mark { flex: 0 0 auto; font-size: 20px; font-weight: 900; width: 26px; text-align: center; }

  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 800;
    background: #1b3048; color: var(--text);
  }
  .pill .k { font-size: 10px; letter-spacing: .1em; color: var(--text-dim); font-weight: 700; }

  .cta {
    margin-top: 18px; border: 1px solid rgba(255,209,102,.35);
    background: rgba(255,209,102,.06); border-radius: 14px; padding: 16px;
  }
  .cta .head { font-size: 15px; font-weight: 900; margin-bottom: 12px; }
  .cta ul { margin: 14px 0; padding-left: 18px; color: var(--text-dim); font-size: 13px; line-height: 1.9; }
  .cta a.buy {
    display: block; text-align: center; text-decoration: none;
    background: var(--accent-2); color: #1a2433; font-weight: 900; font-size: 14px;
    border-radius: 12px; padding: 13px 16px;
  }

  /* 有料版イメージ(実際の画面のスクリーンショット) */
  .shots {
    display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    margin: 0 -2px;
  }
  .shot {
    flex: 0 0 78%; scroll-snap-align: start;
    border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    background: var(--panel-2);
  }
  .shot img { display: block; width: 100%; height: auto; }
  .shot figcaption {
    padding: 10px 12px 12px; font-size: 12px; line-height: 1.6; color: var(--text-dim);
  }
  .shot figcaption b { color: var(--text); }
  .shots-hint {
    font-size: 11px; color: var(--text-faint); text-align: right; margin: -4px 0 12px;
  }

  .note {
    margin-top: 22px; color: var(--text-faint); font-size: 11px; line-height: 1.8; text-align: center;
  }
  .note a { color: var(--text-dim); }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <span class="eyebrow">WAKE 無料公開版</span>
    <h1>今日の<span class="hl">本命</span>と<br>荒れ具合だけ、無料で。</h1>
    <p class="sub">ログイン不要。総合上位2艇・荒れ度・見送りAI判定を毎日無料で公開しています。<br>穴目・買い目・根拠の内訳は有料版限定です。</p>
  </header>

  <div class="card">
    <h2>レースを選ぶ</h2>
    <div class="row">
      <div class="field">
        <label for="venue">開催場</label>
        <select id="venue"></select>
      </div>
      <div class="field" style="flex: 0 0 90px;">
        <label for="raceNo">R</label>
        <select id="raceNo"></select>
      </div>
      <div class="field">
        <label>日付</label>
        <div class="date-fixed" id="raceDateDisplay"></div>
      </div>
    </div>
    <button class="primary" id="go">この場・Rの予想を見る</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <h2 id="resultTitle">結果</h2>
    <div class="boats" id="boats"></div>
    <div class="pills" id="pills"></div>
  </div>

  <div class="cta">
    <div class="head">実際はこんな風に見れます</div>

    <div class="shots">
      <figure class="shot">
        <img src="assets/preview-breakdown.jpg" alt="有料版の評価内訳画面。◎の合計点と、枠別成績・展示・モーター・STそれぞれの配点、判定の根拠コメントが表示されている" loading="lazy" />
        <figcaption><b>①なぜその印か、内訳まで見える</b><br>枠別成績・展示・モーター・STを項目別に採点</figcaption>
      </figure>
      <figure class="shot">
        <img src="assets/preview-tickets.jpg" alt="有料版の買い目画面。本命・対抗の具体的な3連単の組み合わせと合成オッズが表示されている" loading="lazy" />
        <figcaption><b>②具体的な買い目まで</b><br>本命・対抗・穴の3連単と合成オッズ</figcaption>
      </figure>
    </div>
    <p class="shots-hint">← スワイプで次の画面 →</p>

    <ul>
      <li>そのほか、1番人気との一致判定や見送りAIの数値根拠も見られます</li>
    </ul>
    <a class="buy" href="https://note.com/hunaken_akademia/n/n18045ee7c80b" target="_blank" rel="noreferrer">有料版WAKEを見る</a>
  </div>

  <p class="note">
    本ツールは予想補助であり、的中や利益を保証するものではありません。<br>
    表示内容は過去データに基づくAI予想です。<a href="https://newhunaken456.vercel.app/tokushoho.html" target="_blank" rel="noreferrer">特定商取引法に基づく表記</a>
  </p>

</div>
<script src="app.js"></script>
</body>
</html>
